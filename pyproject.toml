[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytho-arena"
version = "0.5.0"
description = "Pytho Arena: GPU-friendly, extensible multi-faction policy simulation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.6",
  "torch>=2.2",
  "protobuf>=7.35.1",
  "grpcio>=1.83.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
]
dev = [
  "pytho-arena[server]",
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.12",
  "grpcio-tools>=1.83.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pytho_arena.scenario" = ["library/*.json"]
"pytho_arena.server" = [
  "frontend/*.css",
  "frontend/*.html",
  "frontend/*.js",
  "frontend/assets/*",
  "frontend/assets/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
# Generated protobuf clients (scripts/sync-coa-contracts.sh); never hand-edited.
extend-exclude = ["src/pytho", "contracts-import"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
