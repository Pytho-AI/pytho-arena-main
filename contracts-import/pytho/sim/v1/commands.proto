// Trainer/EXCON/bot intent contract. Every mutation of authoritative state
// enters through a CommandEnvelope and yields exactly one CommandResult event.
syntax = "proto3";

package pytho.sim.v1;

import "pytho/sim/v1/common.proto";
import "pytho/sim/v1/components.proto";

message CommandEnvelope {
  string command_id = 1;        // client-generated UUID
  WorldId world_id = 2;
  BranchId branch_id = 3;
  uint64 expected_revision = 4; // world state revision the client acted on
  // Audit claims only. The server derives the real principal/role from the
  // authenticated session; mismatches are recorded and rejected.
  string claimed_actor_id = 5;
  string claimed_role = 6;
  EntityId target_entity = 7;   // owned entity (or 0 with target_task_id set)
  string target_task_id = 8;
  Tick desired_tick = 9;        // tick at/after which the command applies
  string idempotency_key = 10;
  string payload_version = 11;  // e.g. "command-payload-v1"
  oneof payload {
    MoveCommand move = 20;
    TaskCommand task = 21;
    SensorTaskCommand sensor_task = 22;
    EffectAuthorizationCommand effect_authorization = 23;
    HoldCommand hold = 24;
    DenyCommand deny = 25;
    DemonstrationControlCommand demonstration = 26;
    PauseRateCommand pause_rate = 27;
    FormationCommand formation = 28;
  }
}

message MoveCommand {
  Vec3 destination_m = 1;
  double speed_mps = 2;         // 0 = model default
  string mobility_mode = 3;
}

message TaskCommand {
  TaskNode task = 1;
  bool replace_current = 2;
}

message SensorTaskCommand {
  string sensor_id = 1;
  double boresight_heading_rad = 2;
  bool active = 3;
}

// Operator authorization of a held effect request (hold/deny/authorize path).
message EffectAuthorizationCommand {
  string request_id = 1;        // pending ROE request id
  string decision = 2;          // "authorize"
  string evidence_track_id = 3; // track snapshot the operator judged
}

message HoldCommand {
  string request_id = 1;
  double hold_seconds = 2;
}

message DenyCommand {
  string request_id = 1;
  string reason = 2;
}

// Start/stop/correct a demonstration session on one bot or formation policy.
message DemonstrationControlCommand {
  string session_id = 1;
  string action = 2;            // "start" | "handoff" | "correct" | "return_to_bot"
  EntityId controlled_entity = 3;
  string replaced_policy_id = 4;
  string dataset_id = 5;        // recording target
}

message PauseRateCommand {
  bool paused = 1;
  double time_scale = 2;        // 1.0 = real time; 0 invalid when paused=false
  bool single_step = 3;
}

message FormationCommand {
  repeated EntityId members = 1;
  string formation_type = 2;
  bytes parameters = 3;
  string parameters_version = 4;
}

enum CommandDisposition {
  COMMAND_DISPOSITION_UNSPECIFIED = 0;
  COMMAND_DISPOSITION_ACCEPTED = 1;
  COMMAND_DISPOSITION_REJECTED = 2;
  COMMAND_DISPOSITION_DEDUPLICATED = 3; // idempotency key already applied
}

message CommandResult {
  string command_id = 1;
  CommandDisposition disposition = 2;
  ReasonCode reason = 3;        // set when rejected
  string reason_detail = 4;
  Tick applied_tick = 5;        // tick at which the command took effect
  uint64 resulting_revision = 6;
  string result_event_id = 7;   // durable event recording this decision
  // Server-derived truth of who issued it (never the client claim).
  string server_actor_id = 8;
  string server_role = 9;
}
